<script>
    a = document.getElementById("raw");
    a.href = "/raw" + window.location.pathname;
    let url = document.getElementById("url")
    if (window.location.pathname !== "/") {
        url.insertAdjacentText("afterbegin", window.location.pathname)
        url.classList.remove("hidden")
        let copyButton = document.querySelector(".fa-copy");
        if (copyButton) {
            copyButton.addEventListener("click", function () {
                navigator.clipboard.writeText(window.location.href).then(function () {
                    url.textContent = "Copied!";
                    setTimeout(function () {
                        url.innerHTML = window.location.pathname + " <i class='fas fa-copy'></i>";
                    }, 1000);
                }).catch(function (err) {
                    console.error('Could not copy URL: ', err);
                });
            });
        }
    }
    
    document.addEventListener("keydown", function(e) {
        if (e.ctrlKey && !e.shiftKey && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            let saveBtn = document.getElementById("save") || document.getElementById("save_btn");
            if (saveBtn && !saveBtn.disabled) {
                saveBtn.click();
            }
        }
        else if (e.altKey && !e.ctrlKey && !e.shiftKey && (e.key === 'n' || e.key === 'N')) {
            e.preventDefault();
            window.location.href = "/";
        }
        else if (e.ctrlKey && e.shiftKey && (e.key === 'r' || e.key === 'R')) {
            e.preventDefault();
            let rawLink = document.getElementById("raw") || document.getElementById("raw_link");
            if (rawLink && rawLink.href && !rawLink.disabled) {
                window.location.href = rawLink.href;
            }
        }
    });
</script>
